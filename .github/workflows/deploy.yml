name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  issues: write
  contents: write
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Apply D1 migrations
        run: yarn db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Rest alerts (Cloudflare Queue + the separate rest-notifications consumer
      # Worker) are deliberately OFF for this free-tier-only deployment phase.
      # workers/wrangler.toml sets REST_ALERTS_ENABLED=false, which the app already
      # treats as a clean, user-facing "disabled" response (see restAlertsProcedure
      # in workers/functions/lib/routes/restNotifications.ts) rather than an error.
      # To re-enable: restore the "Validate rest notification secrets" / "Ensure
      # rest notification queue" / "Deploy rest notification consumer" / "Configure
      # rest notification consumer" / "Configure rest notification Pages secrets"
      # steps from git history (removed in the same commit as this comment), add
      # the VAPID_PUBLIC_KEY/VAPID_PRIVATE_KEY GitHub Actions secrets, add back
      # [[queues.producers]] in workers/wrangler.toml pointing at a Queue you've
      # created, and flip REST_ALERTS_ENABLED back to "true".

      - name: Build
        run: yarn build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_R2_BASE_URL: ${{ vars.VITE_R2_BASE_URL }}

      - name: Deploy to Cloudflare Pages
        run: yarn workspace @macromaxxing/workers wrangler pages deploy --project-name=${{ github.event.repository.name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
